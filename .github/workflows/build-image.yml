name: Build and publish image

# Builds the patched vLLM image and publishes it to GHCR.
#
# arm64 only, on purpose: the target is a DGX Spark / GB10 (Grace, aarch64). A public
# repo gets free native arm64 runners, so this needs no QEMU emulation.
#
# The base image is ~20 GB and every layer has to be re-uploaded (GHCR cannot dedupe
# against Docker Hub), so disk on the runner is the tight resource -- hence the cleanup
# step and the before/after `df` reports. If a run dies at "no space left on device",
# that is what to look at first.
#
# No build cache is configured on purpose: GitHub's Actions cache caps at 10 GB, well
# under this image, and a registry cache would double GHCR storage for layers that only
# change when Dockerfile or src/ does. The paths filter below is the cheaper answer.

on:
  # Publish whenever something that affects the image lands on main. Doc-only commits
  # deliberately do not trigger a 20 GB rebuild.
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - ".github/workflows/build-image.yml"
    tags: ["v*"]
  # Verify the image still builds on PRs that touch it, without publishing.
  pull_request:
    paths:
      - "Dockerfile"
      - "src/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (alongside latest and the commit sha)"
        required: false
        default: "fp8"

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Disk before
        run: df -h /

      - name: Reclaim disk
        run: |
          # The base image alone is ~20 GB; clear anything preinstalled we do not need.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skipped on pull_request: forks get a read-only token, and a PR should not publish.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The built-in token already carries packages:write via the permissions
          # block above -- no PAT and no scope refresh needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # org.opencontainers.image.source is what links the package to this repo on
          # GHCR; without it the package shows up unattached.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Qwen3.8-Flash-Next on one DGX Spark / GB10 - patched vLLM (PLE mmap, GB10 FLA fixes, exact QSA top-k, fp8 hybrid, fp8 QSA KV)
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=tag
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Disk after
        if: always()
        run: df -h /

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "### Image built (not published)"
              echo
              echo "PRs verify the build only; publishing happens on \`main\`."
            else
              echo "### Image published"
              echo
              echo '```'
              echo "docker pull ghcr.io/${{ github.repository }}:latest"
              echo '```'
              echo
              echo "Tags:"
              echo '```'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
              echo
              echo "> New GHCR packages are **private** by default. Making this pullable by"
              echo "> others is a one-time flip at *Package settings -> Change visibility ->"
              echo "> Public*; later pushes keep whatever you set. There is no supported API"
              echo "> for that change, so the workflow cannot do it for you."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
