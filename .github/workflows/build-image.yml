name: Build and publish image

# Builds the patched vLLM image and pushes it to GHCR.
#
# arm64 only, on purpose: the target is a DGX Spark / GB10 (Grace, aarch64). A public
# repo gets free native arm64 runners, so this needs no QEMU emulation.
#
# The base image is ~20 GB and every layer has to be re-uploaded (GHCR cannot dedupe
# against Docker Hub), so disk on the runner is the tight resource -- hence the cleanup
# step and the before/after `df` reports. If a run dies at "no space left on device",
# that is what to look at first.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (in addition to latest + the commit sha)"
        required: false
        default: "fp8"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - ".github/workflows/build-image.yml"

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Disk before
        run: df -h / /var/lib/docker 2>/dev/null || df -h /

      - name: Reclaim disk
        run: |
          # The base image alone is ~20 GB; clear anything preinstalled we do not need.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Actions' built-in token already carries packages:write via the
          # permissions block above -- no PAT and no scope refresh needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Disk after
        if: always()
        run: df -h /
